openapi: 3.0.3
info:
  title: API Log & Commentaries
  description: Spécification complète des routes de l'application (Générée à partir du routage Gin).
  version: 1.0.0
servers:
  - url: /api/v1
    description: Serveur Local ou Base API

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      responses:
        '201':
          description: User successfully registered
        '400':
          description: Invalid input data

  /auth/login:
    post:
      summary: User login
      tags:
        - Authentication
      responses:
        '200':
          description: Successfully authenticated, token returned
        '401':
          description: Unauthorized

  /auth/refresh:
    post:
      summary: Refresh authentication token
      tags:
        - Authentication
      responses:
        '200':
          description: Token refreshed successfully

  /auth/password-reset/request:
    post:
      summary: Request a password reset link
      tags:
        - Authentication
      responses:
        '200':
          description: Reset email sent

  /auth/password-reset/confirm:
    post:
      summary: Confirm password reset
      tags:
        - Authentication
      responses:
        '200':
          description: Password successfully updated

  /auth/google:
    get:
      summary: Initiate Google OAuth2 login
      tags:
        - Authentication
      responses:
        '302':
          description: Redirect to Google login page

  /auth/google/callback:
    get:
      summary: Google OAuth2 callback listener
      tags:
        - Authentication
      responses:
        '200':
          description: Authentication successful

  /auth/logout:
    post:
      summary: Logout current user
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully logged out
        '401':
          description: Unauthorized

  /users/me:
    patch:
      summary: Update current user profile
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile updated
        '401':
          description: Unauthorized

  /users/{userId}/projects:
    get:
      summary: Get projects by a specific user
      tags:
        - Projects
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of user projects

  /logs:
    get:
      summary: Get list of public logs/posts
      tags:
        - Logs
      responses:
        '200':
          description: A list of logs
    post:
      summary: Create a new log
      tags:
        - Logs
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                content:
                  type: string
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized

  /logs/{id}:
    get:
      summary: Get a specific log by ID
      tags:
        - Logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Log details
    patch:
      summary: Update a log
      tags:
        - Logs
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Log updated
        '401':
          description: Unauthorized
    delete:
      summary: Delete a log
      tags:
        - Logs
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Log deleted
        '401':
          description: Unauthorized

  /logs/{id}/image:
    post:
      summary: Upload an image for a log
      tags:
        - Logs
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image uploaded successfully
    delete:
      summary: Delete a log's image
      tags:
        - Logs
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image deleted successfully

  /logs/{id}/similar:
    get:
      summary: Get similar logs
      tags:
        - Search
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of similar logs

  
  /categories:
    get:
      summary: Get all categories
      tags:
        - Categories
      responses:
        '200':
          description: List of categories
    post:
      summary: Create a new category (Moderator/Admin only)
      tags:
        - Categories
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Category created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Insufficient permissions

  /categories/{id}:
    patch:
      summary: Update a category (Moderator/Admin only)
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category updated
    delete:
      summary: Delete a category (Moderator/Admin only)
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted


  /projects/{id}:
    get:
      summary: Get project by ID
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details
    patch:
      summary: Update a project
      tags:
        - Projects
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project updated
    delete:
      summary: Delete a project
      tags:
        - Projects
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project deleted

  /projects:
    post:
      summary: Create a project
      tags:
        - Projects
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Project created

  /projects/{id}/posts/{postId}:
    post:
      summary: Add a post to a project
      tags:
        - Projects
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post added to project
    delete:
      summary: Remove a post from a project
      tags:
        - Projects
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post removed from project

  /ws:
    get:
      summary: Establish WebSocket connection for real-time messaging
      tags:
        - Messages
      description: Requires JWT token validation query or header.
      responses:
        '101':
          description: Switching Protocols to WebSocket

  /messages:
    get:
      summary: Get user conversations
      tags:
        - Messages
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of conversations
    post:
      summary: Send a direct message
      tags:
        - Messages
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Message sent

  /messages/{userID}:
    get:
      summary: Get message thread with a specific user
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message thread history

  /messages/{messageID}/read:
    put:
      summary: Mark a message as read
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: messageID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message marked as read

  /push/vapid-public-key:
    get:
      summary: Get VAPID public key for Web Push
      tags:
        - Notifications
      responses:
        '200':
          description: VAPID public key

  /push/subscribe:
    post:
      summary: Subscribe to push notifications
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Subscribed successfully

  /push/unsubscribe:
    delete:
      summary: Unsubscribe from push notifications
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Unsubscribed successfully

  /notifications:
    get:
      summary: Get user notifications
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of notifications

  /search:
    get:
      summary: Global search
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: false
          description: Search query string
          schema:
            type: string
      responses:
        '200':
          description: Search results

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT